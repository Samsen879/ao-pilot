name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 20
          - 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ao:test:acceptance
      - run: npm run verify:package
      - run: npm run verify:runtime-lock
      - run: npm run verify:runtime-bootstrap
      - run: npm run verify:runtime-lifecycle
      - run: npm audit --omit=dev
