name: release-check

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bind exact release candidate
        run: |
          echo "AO_PHASE_ZERO_EXPECTED_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "AO_PHASE_ZERO_EXPECTED_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - run: npm run release:check
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: ao-pilot-package
          path: ao-pilot-*.tgz
          if-no-files-found: error
