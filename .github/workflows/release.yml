name: release-check

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  current-source:
    uses: ./.github/workflows/current-source.yml
    with:
      ref: ${{ github.sha }}

  package:
    needs: current-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bind exact release candidate
        run: |
          echo "AO_PHASE_ZERO_EXPECTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "AO_PHASE_ZERO_EXPECTED_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - run: npm run release:check
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: ao-pilot-package
          path: ao-pilot-*.tgz
          if-no-files-found: error
