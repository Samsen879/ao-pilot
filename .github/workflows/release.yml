name: release-check

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  current-source:
    uses: ./.github/workflows/current-source.yml
    with:
      ref: ${{ github.sha }}

  package:
    needs: current-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bind exact release candidate
        run: |
          echo "AO_PHASE_ZERO_EXPECTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "AO_PHASE_ZERO_EXPECTED_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - run: sudo apt-get update && sudo apt-get install -y tmux sqlite3
      - name: Resolve independently locked old artifact (build only)
        run: |
          ./scripts/bootstrap.sh --json > "$RUNNER_TEMP/old-runtime-bootstrap.json"
          node bin/ao-pilot.js runtime-path --json > "$RUNNER_TEMP/old-runtime.json"
      - name: Build immutable archive and pack once
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { buildRelease } from './scripts/ao/lib/release-builder.js';
          const old = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'old-runtime.json'), 'utf8'));
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          // Source-owned release/compatibility.json + empty fixture are mandatory.
          // Missing compatibility inputs block promotion; CI never invents PASS.
          const built = await buildRelease({ repository: process.cwd(), commit: process.env.AO_PHASE_ZERO_EXPECTED_HEAD,
            version, output: path.join(process.env.RUNNER_TEMP, 'ao-pack-once'), oldBinary: old.binary_path });
          fs.appendFileSync(process.env.GITHUB_ENV, `AO_RELEASE_BUNDLE=${built.bundle}\nAO_RELEASE_TARBALL=${path.join(built.bundle, 'package.tgz')}\nAO_RELEASE_TARBALL_SHA256=${built.npm_tarball_sha256}\nAO_RELEASE_ENVELOPE_SHA256=${built.envelope_sha256}\n`);
          JS
      - run: npm run release:check
      - name: Recheck envelope, payload and exact bytes before upload
        run: node --input-type=module -e "import {verifyReleaseEnvelope} from './scripts/ao/lib/release-builder.js'; verifyReleaseEnvelope(process.env.AO_RELEASE_BUNDLE, process.env.AO_RELEASE_ENVELOPE_SHA256);"
      - uses: actions/upload-artifact@v4
        with:
          name: ao-pilot-linux-x64-release
          path: ${{ env.AO_RELEASE_BUNDLE }}
          if-no-files-found: error
