name: workstation-self-hosting-proof

on:
  workflow_dispatch:
    inputs:
      receipt_path:
        description: Repository-relative P0-R08 workstation receipt path
        required: true
        default: docs/runtime-portability/p0-r08-workstation-self-hosting-receipt.json

permissions:
  contents: read

jobs:
  verify-self-hosting-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:self-hosting -- --receipt "${{ inputs.receipt_path }}"

